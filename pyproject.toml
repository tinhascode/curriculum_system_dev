[project]
name = "curriculo-ats-api"
version = "0.1.0"
description = "API para montagem e exportação de currículos otimizados para ATS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.5.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
